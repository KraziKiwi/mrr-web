<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview | MRR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mrr-white': '#fdfdfd',
                        'mrr-black': '#121212',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white">
    <main class="relative min-h-screen flex flex-col items-center justify-center p-4 md:p-8 overflow-hidden">
        <!-- Background Image with Overlay -->
        <div
          class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat"
          style="background-image: url('prof logo.png'); filter: brightness(0.45);"
        ></div>

        <!-- Decorative Frame -->
        <div class="absolute inset-4 md:inset-10 border border-mrr-white/30 pointer-events-none z-20"></div>

        <!-- Content Container -->
        <div class="relative z-10 w-full max-w-3xl flex flex-col items-center text-center space-y-8">

          <!-- Company Logo -->
          <div class="w-full max-w-[280px] md:max-w-xl mb-4">
            <img
              src="MRR_Logo.svg"
              alt="MRR Logo"
              class="w-full h-auto"
            >
          </div>

          <!-- Headlines -->
          <div class="space-y-4 max-w-2xl px-4">
            <p class="text-lg md:text-xl font-medium">
              <span class="text-white">mrr</span>
              <span class="text-mrr-white">content</span>
              <span class="text-gray-300"> is an innovative new building company.</span>
            </p>
            <p class="text-sm md:text-base text-gray-400 leading-relaxed">
              We are currently building a new home whilst we're building this website. <br/>
              We are excited to launch this very soon but in the meantime please get in touch via the form below.
            </p>
          </div>

          <!-- Contact Form -->
          <form class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
            <!-- Name -->
            <div class="flex flex-col space-y-1">
              <input
                type="text"
                placeholder="Name *"
                required
                class="bg-white/10 border border-mrr-white/30 focus:border-mrr-white outline-none p-3 rounded text-white placeholder-gray-500 transition-all"
              >
            </div>

            <!-- Email -->
            <div class="flex flex-col space-y-1">
              <input
                type="email"
                placeholder="Email *"
                required
                class="bg-white/10 border border-mrr-white/30 focus:border-mrr-white outline-none p-3 rounded text-white placeholder-gray-500 transition-all"
              >
            </div>

            <!-- Phone -->
            <div class="flex flex-col space-y-1 md:col-span-2">
              <input
                type="tel"
                placeholder="Phone"
                class="bg-white/10 border border-mrr-white/30 focus:border-mrr-white outline-none p-3 rounded text-white placeholder-gray-500 transition-all"
              >
            </div>

            <!-- Services Dropdown -->
            <div class="flex flex-col space-y-1 md:col-span-2">
              <select
                class="bg-white/10 border border-mrr-white/30 focus:border-mrr-white outline-none p-3 rounded text-white appearance-none cursor-pointer transition-all"
              >
                <option value="" disabled selected class="bg-gray-900">Services</option>
                <option value="residential" class="bg-gray-900">Residential Build</option>
                <option value="renovation" class="bg-gray-900">Renovation / Extension</option>
                <option value="architectural" class="bg-gray-900">Architectural Project</option>
              </select>
            </div>

            <!-- Message -->
            <div class="flex flex-col space-y-1 md:col-span-2">
              <textarea
                placeholder="How can we help?"
                rows="4"
                class="bg-white/10 border border-mrr-white/30 focus:border-mrr-white outline-none p-3 rounded text-white placeholder-gray-500 transition-all resize-none"
              ></textarea>
            </div>

            <!-- Submit Button -->
            <button
              type="button"
              class="md:col-span-2 bg-gradient-to-r from-gray-200 to-white hover:from-white hover:to-gray-200 text-black font-bold py-4 rounded transition-all transform active:scale-[0.98] tracking-widest text-sm"
            >
              GET IN TOUCH
            </button>
          </form>

          <!-- Footer -->
          <footer class="pt-8 text-xs text-gray-500">
            &copy; 2026 MRR PTY LTD. All rights reserved.
          </footer>
        </div>
    </main>
</body>
</html>
